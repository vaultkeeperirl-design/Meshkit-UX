name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release:
    name: Build & Release App
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Clone Required Repositories (tools)
      working-directory: backend
      shell: bash
      run: |
        mkdir -p tools
        cd tools
        if [ ! -d "mergekit" ] || [ -z "$(ls -A mergekit 2>/dev/null)" ]; then
            rm -rf mergekit
            git clone https://github.com/arcee-ai/mergekit.git
            rm -rf mergekit/.git
        fi
        if [ ! -d "llama.cpp" ] || [ -z "$(ls -A llama.cpp 2>/dev/null)" ]; then
            rm -rf llama.cpp
            git clone https://github.com/ggerganov/llama.cpp.git
            rm -rf llama.cpp/.git
        fi

    - name: Cache llama.cpp build
      uses: actions/cache@v4
      with:
        path: backend/tools/llama.cpp/build
        key: ${{ runner.os }}-llama.cpp-build-${{ hashFiles('backend/tools/llama.cpp/**') }}
        restore-keys: |
          ${{ runner.os }}-llama.cpp-build-

    - name: Install Frontend Dependencies
      working-directory: frontend
      shell: bash
      run: npm ci

    - name: Lint Frontend
      working-directory: frontend
      shell: bash
      run: npm run lint

    - name: Install Backend Dependencies
      working-directory: backend
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pytest

    - name: Install local mergekit and compile llama.cpp
      working-directory: backend
      shell: bash
      run: |
        # Build llama.cpp
        cd tools/llama.cpp
        # Use cmake to build llama.cpp
        cmake -B build
        cmake --build build --config Release
        # Copy compiled binaries to the expected location
        if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/bin/Release/*.exe .
        else
            cp build/bin/llama-* .
        fi
        pip install -r requirements.txt
        cd ../..

        # Install mergekit locally
        cd tools/mergekit
        pip install -e .
        cd ../..

    - name: Run Backend Tests
      working-directory: backend
      shell: bash
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/

    - name: Build PyInstaller Backend
      working-directory: backend
      shell: bash
      run: python build_backend.py

    - name: Verify PyInstaller Output
      working-directory: backend
      shell: bash
      run: ls -la dist

    - name: Build Frontend & Electron App
      working-directory: frontend
      shell: bash
      run: npm run electron:build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MergekitStudio-Setup-${{ matrix.os }}
        path: |
          frontend/dist-electron/*.exe
          frontend/dist-electron/*.AppImage
          frontend/dist-electron/*.tar.gz

  publish_release:
    name: Publish Release
    needs: [release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_artifacts

    - name: Update Latest Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        # Delete existing release and tag if it exists
        gh release delete latest --cleanup-tag -y || true

        # The downloaded artifacts are inside subdirectories named after the artifact name
        # Use an array to correctly handle filenames with spaces
        mapfile -t FILES < <(find release_artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.tar.gz" \))

        if [ ${#FILES[@]} -gt 0 ]; then
            gh release create latest "${FILES[@]}" --title "Latest Build" --notes "Automated build from latest commit on main branch."
        fi
