name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Electron App
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Backend Dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Clone Required Repositories (tools)
      working-directory: backend
      shell: bash
      run: |
        mkdir -p tools
        cd tools
        if [ ! -d "mergekit" ]; then
            git clone https://github.com/arcee-ai/mergekit.git
        fi
        if [ ! -d "llama.cpp" ]; then
            git clone https://github.com/ggerganov/llama.cpp.git
        fi

    - name: Install local mergekit and compile llama.cpp
      working-directory: backend
      shell: bash
      run: |
        # Install mergekit locally
        cd tools/mergekit
        pip install -e .
        cd ../..

        # Build llama.cpp
        cd tools/llama.cpp
        # Use cmake to build llama.cpp on Windows
        cmake -B build
        cmake --build build --config Release
        # Copy compiled binaries to the expected location
        cp build/bin/Release/*.exe .
        pip install -r requirements.txt

    - name: Build PyInstaller Backend
      working-directory: backend
      run: python build_backend.py

    - name: Verify PyInstaller Output
      working-directory: backend
      run: dir dist

    - name: Build Frontend & Electron App
      working-directory: frontend
      run: npm run electron:build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MergekitStudio-Setup
        path: frontend/dist-electron/*.exe

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        gh release create ${{ github.ref_name }} frontend/dist-electron/*.exe --title "Release ${{ github.ref_name }}" --generate-notes
