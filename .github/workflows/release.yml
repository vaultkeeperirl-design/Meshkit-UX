name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: pip install -r requirements.txt

    - name: Verify Backend Syntax
      working-directory: ./backend
      run: python -m compileall .

    - name: Package Release
      run: |
        mkdir -p release_package
        cp -r backend release_package/
        cp -r frontend/dist release_package/frontend_dist
        cp setup.sh release_package/
        cp README.md release_package/
        tar -czvf meshkit-ux-${{ github.ref_name }}.tar.gz release_package/

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} meshkit-ux-${{ github.ref_name }}.tar.gz --title "Release ${{ github.ref_name }}" --generate-notes
